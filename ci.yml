name: RaceDay CI

# Builds the API, tests and MVC project, checks the repository structure, and builds the Docker image.
# NOTE: if this solution lives in a sub-folder of your repo, uncomment the "defaults" block and set the folder name.
on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # defaults:
    #   run:
    #     working-directory: Part3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore RaceDay.sln

      - name: Build API, tests and MVC project
        run: dotnet build RaceDay.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test RaceDay.sln --configuration Release --no-build --verbosity normal

      - name: Validate repository structure
        run: |
          test -f RaceDay.Api/RaceDay.Api.csproj
          test -f RaceDay.Web/RaceDay.Web.csproj
          test -f RaceDay.Web/Dockerfile
          test -f README.md
          echo "Repository structure OK"

      - name: Build Docker image
        run: docker build -t raceday-web RaceDay.Web
